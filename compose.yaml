# Runs the whole app:  docker compose up --build
# Then open http://localhost:8080 (or the port set in APP_PORT).
services:
  backend:
    build: ./backend
    environment:
      # The browser only talks to nginx (same origin), so CORS is disabled.
      CORS_ALLOWED_ORIGIN: ""
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      - backend
    restart: unless-stopped