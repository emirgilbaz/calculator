# Serves the built React app and forwards /api to the Go backend.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Docker's internal DNS. Resolving the backend per request (instead of once
    # at startup) means nginx starts even if the backend isn't up yet, and keeps
    # working when the backend container restarts with a new IP address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $backend http://backend:8080;

    # Security headers for every response.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API calls go to the Go backend; the path is passed through unchanged.
    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Build output has content hashes in its file names, so it can be cached forever.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Everything else is the app itself. index.html must never be cached,
    # so users always get the latest asset file names after a deploy.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}